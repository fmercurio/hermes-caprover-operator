[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-caprover-operator"
version = "0.1.0"
description = "Human-approved CapRover image plans with durable uncertainty and observation receipts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Felippe Mercurio"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
caprover-operator = "caprover_operator.__main__:main"

[project.urls]
Repository = "https://github.com/fmercurio/hermes-caprover-operator"

[tool.setuptools]
packages = ["caprover_operator"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
